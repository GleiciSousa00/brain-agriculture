name: ci

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trabalho rápido: tudo que responde em poucos minutos e não precisa de dependência de pé.
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O pnpm vem pelo Corepack, com a versão que o `packageManager` fixa. Uma ação de
      # terceiro a menos, e sem a descontinuação do Node 20 que ela arrasta.
      - name: Habilitar o pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint, com limite de complexidade cognitiva
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Regra de dependência entre camadas
        run: pnpm depcruise

      # Com cobertura, porque o limite declarado no `jest.config.ts` só reprova quando o
      # relatório é pedido. O `pnpm test`, sem cobertura, existe para o laço de TDD, que
      # roda na metade do tempo.
      - name: Testes de unidade, com portão de cobertura
        run: pnpm test:coverage

      # A especificação é versionada. Se ela sair diferente do que está commitado, o
      # contrato mudou sem que o arquivo e o cliente gerado acompanhassem.
      - name: Especificação OpenAPI em dia
        run: pnpm openapi:check

      - name: Auditoria de dependências, portão em alta e crítica
        run: pnpm audit:gate

      - name: Auditoria de dependências, relatório em moderada
        run: pnpm audit:report

      - name: Build dos pacotes
        run: pnpm build

      # Puxar imagem do Docker Hub falha de vez em quando por conta do serviço, e não da
      # mudança: em 2026-09-10 o registro devolveu 500 ao autorizar o `node:24-alpine`, e a
      # execução seguinte, sem alteração nenhuma, passou inteira. Três tentativas em shell
      # puro, sem ação de terceiro, pela mesma razão que trocou a ação do pnpm pelo Corepack.
      # Autenticar no registro não resolveria: o limite de uso anônimo é 429, e a falha foi
      # 500 do serviço de autorização.
      - name: Imagem Docker da API
        run: |
          for tentativa in 1 2 3; do
            if docker build --file apps/api/Dockerfile --tag cadastro-rural-api:${{ github.sha }} .; then
              exit 0
            fi
            echo "a construção falhou na tentativa $tentativa"
            [ "$tentativa" = 3 ] || sleep 15
          done
          echo 'a imagem da API não foi construída em três tentativas'
          exit 1

      # A imagem da web carrega o Caddyfile que entrega o estático e repassa `/api`.
      # Construí-la e mandar o próprio Caddy conferir a configuração é o portão sintático
      # desse arquivo: nenhum teste de unidade o alcança. O portão de comportamento é a
      # composição, no trabalho de integração. O Caddyfile de produção, em `deploy/`, é
      # conferido pela mesma imagem, com valores de mentira nas variáveis que ele lê.
      #
      # A nova tentativa envolve só a construção. O `caddy validate` roda uma vez, no ramo
      # de sucesso, porque ele reprova por configuração inválida, que não é falha de
      # registro e não melhora com tentativa nova.
      - name: Imagem Docker da interface web
        run: |
          for tentativa in 1 2 3; do
            if docker build --file apps/web/Dockerfile --tag cadastro-rural-web:${{ github.sha }} .; then
              docker run --rm cadastro-rural-web:${{ github.sha }} \
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
              hash="$(docker run --rm cadastro-rural-web:${{ github.sha }} caddy hash-password --plaintext exemplo)"
              docker run --rm \
                --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
                --env DOMAIN=exemplo.duckdns.org \
                --env BASIC_AUTH_USER=exemplo \
                --env BASIC_AUTH_HASH="$hash" \
                cadastro-rural-web:${{ github.sha }} \
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
              exit 0
            fi
            echo "a construção falhou na tentativa $tentativa"
            [ "$tentativa" = 3 ] || sleep 15
          done
          echo 'a imagem da interface web não foi construída em três tentativas'
          exit 1

      # A composição de produção não sobe no CI: ela puxa imagem do registro, que só existe
      # depois do push na `main`. O que se confere aqui é a interpolação: toda variável que
      # ela exige está no `.env.example`. O exemplo é lido de verdade, com os valores vazios
      # preenchidos: uma variável nova na composição que não entre no exemplo reprova aqui.
      - name: Composição de produção interpola
        run: |
          sed 's/=$/=exemplo/' deploy/.env.example > deploy/.env.ci
          docker compose --file deploy/docker-compose.yml --env-file deploy/.env.ci config --quiet

  # Trabalho lento: reservado aos testes de integração, que sobem dependência de verdade.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O pnpm vem pelo Corepack, com a versão que o `packageManager` fixa. Uma ação de
      # terceiro a menos, e sem a descontinuação do Node 20 que ela arrasta.
      - name: Habilitar o pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar o pacote de contratos
        run: pnpm --filter @cadastro-rural/contracts build

      - name: Testes de integração
        run: pnpm test:integration

      # A composição é conferida aqui porque este é o trabalho que pode gastar tempo.
      #
      # A rota de saúde é consultada pela porta da web, e não pela da API. É o caminho que
      # o navegador faz, e é o único portão de comportamento do Caddyfile: prova que o
      # prefixo `/api` é cortado e que o repasse chega na API. O `caddy validate` do
      # trabalho rápido só prova sintaxe, e foi por uma configuração sintaticamente válida
      # que o nginx, antes dele, resolvia o nome da API uma vez no arranque e quebrava.
      #
      # Os dois laços deste passo contam coisas diferentes, e por isso não repetem o nome
      # da variável. O de `subida` é nova tentativa contra a falha de registro descrita
      # acima, e desiste na terceira. O de `tentativa` não é nova tentativa: é a espera
      # pela API terminar de arrancar, e esgotá-la reprova o passo. É esse segundo laço que
      # pega uma API que não sobe, e é por isso que ele fica exatamente como estava.
      - name: Subir a composição e conferir a rota de saúde pela web
        run: |
          subiu=nao
          for subida in 1 2 3; do
            if docker compose up --build --detach postgres api web; then
              subiu=sim
              break
            fi
            echo "a composição não subiu na tentativa $subida"
            [ "$subida" = 3 ] || sleep 15
          done
          if [ "$subiu" = nao ]; then
            echo 'a composição não subiu em três tentativas'
            docker compose logs
            exit 1
          fi

          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/api/health; then
              echo
              echo "a rota de saúde respondeu pela web na tentativa $tentativa"
              exit 0
            fi
            sleep 2
          done
          echo 'a rota de saúde não respondeu pela web'
          docker compose logs
          exit 1

      # O roteador vive no navegador: um endereço de tela pedido ao servidor precisa
      # devolver o `index.html`, e não 404. É a outra metade do contrato do Caddyfile.
      - name: Conferir que uma rota de tela devolve o index
        run: curl --fail --silent http://localhost:5173/cadastro/produtores | grep --quiet '<div id="root">'

      # A carga e a medição falam com o Postgres da composição, que já está de pé, e sobem a
      # aplicação em processo. A medição é portão: ela falha se a consulta recortada por
      # Safra deixar de usar o índice que o registro 0004 mandou criar.
      - name: Carga de exemplo, carga de volume e medição do painel
        run: |
          pnpm carga:exemplo
          pnpm carga:volume
          pnpm medir:painel
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: cadastro
          POSTGRES_PASSWORD: cadastro
          POSTGRES_DB: cadastro_rural
          # Os mesmos valores públicos da composição. Ver o aviso em `.env.example`.
          DOCUMENTO_ENCRYPTION_KEY: MFxpNBlirscUhol6+3M10FDOP08FwX/wz8GMUNc8Qmw=
          DOCUMENTO_FINGERPRINT_SECRET: 8wJpFBv+Fzfy5s07/oRT5i0/V3kzRif/IT8Uyw9Gh+w=

      # O relatório sai daqui para ser lido, e é ele que o README cita.
      - name: Guardar a medição do painel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plano-do-painel
          path: docs/medicoes/plano-do-painel.md

      - name: Derrubar a composição
        if: always()
        run: docker compose down --volumes

  # Publicação: só na `main`, e só depois dos dois trabalhos acima passarem. As imagens
  # vão para o GitHub Container Registry com a tag do commit e a tag `latest`. A composição
  # de `deploy/` puxa `latest` por padrão e a tag do commit para voltar versão.
  #
  # As imagens são construídas de novo, e não reaproveitadas do trabalho rápido: guardá-las
  # como artefato entre trabalhos custaria mais minutos do que reconstruir. O login usa o
  # token do próprio workflow, sem segredo novo e sem ação de terceiro.
  publish:
    name: publish
    needs: [fast, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Entrar no registro
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      # O registro exige nome em minúsculas, e o dono do repositório tem maiúsculas. O rótulo
      # `source` é o que liga o pacote a este repositório na página Packages; sem ele a
      # imagem aparece só na conta de quem publicou.
      - name: Construir e publicar as imagens
        run: |
          registro="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for imagem in api web; do
            nome="$registro/cadastro-rural-$imagem"
            construiu=nao
            for tentativa in 1 2 3; do
              if docker build --file "apps/$imagem/Dockerfile" \
                --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
                --tag "$nome:${{ github.sha }}" --tag "$nome:latest" .; then
                construiu=sim
                break
              fi
              echo "a construção de $imagem falhou na tentativa $tentativa"
              [ "$tentativa" = 3 ] || sleep 15
            done
            if [ "$construiu" = nao ]; then
              echo "a imagem de $imagem não foi construída em três tentativas"
              exit 1
            fi
            docker push --all-tags "$nome"
          done

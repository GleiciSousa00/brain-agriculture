name: ci

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trabalho rápido: tudo que responde em poucos minutos e não precisa de dependência de pé.
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint, com limite de complexidade cognitiva
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Regra de dependência entre camadas
        run: pnpm depcruise

      - name: Testes de unidade
        run: pnpm test

      - name: Auditoria de dependências, portão em alta e crítica
        run: pnpm audit:gate

      - name: Auditoria de dependências, relatório em moderada
        run: pnpm audit:report

      - name: Build dos pacotes
        run: pnpm build

      - name: Imagem Docker da API
        run: docker build --file apps/api/Dockerfile --tag cadastro-rural-api:${{ github.sha }} .

  # Trabalho lento: reservado aos testes de integração, que sobem dependência de verdade.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar o pacote de contratos
        run: pnpm --filter @cadastro-rural/contracts build

      - name: Testes de integração
        run: pnpm test:integration

      # A composição é conferida aqui porque este é o trabalho que pode gastar tempo.
      - name: Subir a composição e conferir a rota de saúde
        run: |
          docker compose up --build --detach postgres api
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "a rota de saúde respondeu na tentativa $tentativa"
              exit 0
            fi
            sleep 2
          done
          echo 'a rota de saúde não respondeu'
          docker compose logs
          exit 1

      - name: Derrubar a composição
        if: always()
        run: docker compose down --volumes

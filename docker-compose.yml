# Sobe o cadastro inteiro com um comando: `docker compose up --build`.
# As variáveis têm valor padrão, então um clone recém-feito sobe sem `.env`.

name: cadastro-rural

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadastro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadastro}
      POSTGRES_DB: ${POSTGRES_DB:-cadastro_rural}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # A API só arranca depois que o banco aceita conexão.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cadastro} -d ${POSTGRES_DB:-cadastro_rural}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cadastro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadastro}
      POSTGRES_DB: ${POSTGRES_DB:-cadastro_rural}
      # Valores de desenvolvimento. Ver o aviso em `.env.example`.
      DOCUMENTO_ENCRYPTION_KEY: ${DOCUMENTO_ENCRYPTION_KEY:-MFxpNBlirscUhol6+3M10FDOP08FwX/wz8GMUNc8Qmw=}
      DOCUMENTO_FINGERPRINT_SECRET: ${DOCUMENTO_FINGERPRINT_SECRET:-8wJpFBv+Fzfy5s07/oRT5i0/V3kzRif/IT8Uyw9Gh+w=}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:80'

volumes:
  postgres-data:

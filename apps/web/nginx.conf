# Servidor da interface web dentro do Docker.
#
# Duas responsabilidades: entregar o estático e repassar `/api` para a API. O navegador
# fala sempre com esta origem, nunca com a porta da API. Ver o registro 0009.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O roteador vive no navegador. Recarregar em /painel ou /cadastro precisa cair no
    # index, senão o nginx procura um arquivo com esse nome e devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # O DNS embutido do Docker, consultado em cada pedido em vez de uma vez no
        # arranque. Com o nome escrito direto no `proxy_pass`, o nginx o resolve ao
        # subir: se a API ainda não estiver de pé ele recusa arrancar, e se ela reiniciar
        # com outro endereço ele continua falando com o antigo.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api api:3000;

        # Endereço em variável desliga o corte automático do prefixo, então o corte é
        # explícito: /api/painel chega na API como /painel, com a consulta preservada.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Servidor da interface web dentro do Docker.
#
# Duas responsabilidades: entregar o estático e repassar `/api` para a API. O navegador
# fala sempre com esta origem, nunca com a porta da API. Ver o registro 0009.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O roteador vive no navegador. Recarregar em /painel ou /cadastro precisa cair no
    # index, senão o nginx procura um arquivo com esse nome e devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A barra no fim do `proxy_pass` corta o prefixo: /api/painel chega na API como
    # /painel.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
